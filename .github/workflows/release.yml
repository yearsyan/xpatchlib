# Tag-driven release: test, build every artifact on hosted runners, archive
# them on the GitHub Release, then push to each registry — Maven Central
# (vars.PUBLISH_MAVEN), CocoaPods trunk (COCOAPODS_TRUNK_TOKEN), npm
# (vars.PUBLISH_NPM + NPM_TOKEN) and ohpm (vars.PUBLISH_OHPM + its secrets).
# Every publish job is gated on a repo variable, so a missing secret can
# never break artifact builds.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: '0.15.0'
  NDK_VERSION: '28.2.13676358'
  CLT_VERSION: '6.0.0.858'
  CLT_MIRROR_REPO: pippocao/Images
  CLT_MIRROR_TAG: OHOS_Mac_Arm64_CommandLineTool_6.0.0
  CLT_MIRROR_ASSET: commandline-tools-mac-arm64-6.0.0.858.zip

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check -p xpatchlib-ffi -p xpatchlib-jni

  wasm:
    name: wasm package (producer side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: install wasm-pack
        run: |
          curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1
          install -m755 wasm-pack ~/.cargo/bin/wasm-pack
      - run: bash packaging/npm/build.sh
      - run: npm test
        working-directory: packaging/npm
      - name: pack the npm dir for the release assets
        run: |
          cd packaging/npm
          zip -qr "$RUNNER_TEMP/xpatchlib-npm-$(sed -n 's/^  "version": "\(.*\)",/\1/p' package.json).zip" \
            index.js index.d.ts package.json wasm README.md -x 'wasm/.gitignore'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/xpatchlib-npm-*.zip
          if-no-files-found: error

  android:
    name: android aar (replay only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: install ndk
        run: yes | sdkmanager "ndk;${NDK_VERSION}" >/dev/null
      # build-aar.sh discovers the NDK under $ANDROID_HOME/ndk/* by itself.
      - run: bash packaging/android/build-aar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: packaging/android/build/*.aar
          if-no-files-found: error

  ios:
    name: ios xcframework (replay only)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: bash packaging/ios/build-xcframework.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: packaging/ios/build/*.xcframework.zip
          if-no-files-found: error

  harmony:
    name: harmony har (replay only)
    runs-on: macos-14
    # Huawei ships the command-line tools only inside DevEco / behind a
    # developer login; Tencent/BqLog's CI popularized this public mirror
    # of the mac-arm64 commandline-tools zip, which bundles hvigor, ohpm
    # and the full HarmonyOS SDK (~1.8 GB, cached).
    defaults:
      run:
        working-directory: packaging/harmony
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos
      - uses: Swatinem/rust-cache@v2
      - name: restore command-line tools cache
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: ~/.toolcache/ohos-commandline-tools
          key: macos-clt-${{ env.CLT_VERSION }}
      - name: download command-line tools (cache miss)
        if: steps.clt-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.toolcache/ohos-commandline-tools
          gh release download "$CLT_MIRROR_TAG" \
            --repo "$CLT_MIRROR_REPO" --pattern "$CLT_MIRROR_ASSET" \
            --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$CLT_MIRROR_ASSET" -d ~/.toolcache/ohos-commandline-tools
      - name: stage rust static lib + header
        run: |
          OHOS_NDK_HOME="$HOME/.toolcache/ohos-commandline-tools/command-line-tools/sdk/default/openharmony/native" \
            bash build.sh
      - name: assemble har
        run: |
          CLT="$HOME/.toolcache/ohos-commandline-tools/command-line-tools"
          export PATH="$CLT/bin:$PATH"
          export DEVECO_SDK_HOME="$CLT/sdk"
          hvigorw assembleHar --mode module -p product=default --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-har
          path: packaging/harmony/xpatchlib/build/default/outputs/default/xpatchlib.har
          if-no-files-found: error

  maven-central:
    name: maven central upload
    needs: android
    # Flip the PUBLISH_MAVEN repo variable to "true" once the Central
    # Portal secrets are configured. Central releases are immutable — a
    # published version can never be re-uploaded — so skip when the
    # version has already synced to repo1.
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-aar
          path: dist
      - name: skip when the version is already on central
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/io/github/yearsyan/xpatchlib/${VERSION}/xpatchlib-${VERSION}.pom")
          if [[ "$CODE" == "200" ]]; then
            echo "io.github.yearsyan:xpatchlib:${VERSION} already on repo1; skipping upload"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: assemble + sign + upload
        if: env.SKIP != '1'
        run: bash packaging/android/publish-maven.sh dist/xpatchlib-*.aar --upload
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  release:
    name: github release
    needs: [test, wasm, android, ios, harmony]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: sanity check artifacts
        run: ls -la dist/
      - name: freeze assets from earlier successful runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CocoaPods trunk and Maven Central are immutable: once a run has
          # published specs against these bytes, replacing the release asset
          # on a re-tag breaks every later `pod install` and maven fetch.
          # First-run assets win; a re-run only fills in missing names.
          # The by-tag lookup can lag right after a tag is deleted and
          # re-pushed, so retry it; a swallowed failure here cost us a
          # clobbered v0.1.3 asset once already.
          NAMES=""
          for attempt in 1 2 3 4 5; do
            if NAMES="$(gh api \
                "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
                --jq '.assets[].name' 2>/tmp/freeze-err)"; then
              break
            fi
            grep -q '"status": "404"' /tmp/freeze-err && {
              echo "no release for this tag yet (attempt $attempt); retrying in 20s"
              sleep 20; continue
            }
            cat /tmp/freeze-err >&2
            echo "::error::release lookup failed for an unexpected reason"
            exit 1
          done
          echo "existing assets: ${NAMES:-<none>}"
          for name in $NAMES; do
            if [ -f "dist/$name" ]; then
              echo "keeping existing $name (immutable-registry bytes)"
              rm "dist/$name"
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          # Belt to the freeze step above: never replace an asset that is
          # already attached to the release, whatever the lookup found.
          overwrite_files: false

  # ohpm publish needs the ohpm CLI, which only ships inside the Huawei
  # command-line tools — reuse the same cached CLT the harmony job pulled.
  # Secrets (see docs/INTEGRATION.md): OHPM_PUBLISH_ID, OHPM_PRIVATE_KEY
  # (encrypted PEM), OHPM_KEY_PASSPHRASE_CIPHER (the security:... value from
  # `ohpm config encrypt`) and OHPM_CRYPTO_BUNDLE (base64 of
  # `tar -czf - -C ~/.ohpm crypto` — the component that decrypts the cipher).
  ohpm:
    name: ohpm publish
    needs: [harmony, release]
    if: vars.PUBLISH_OHPM == 'true'
    runs-on: macos-14
    steps:
      - name: restore command-line tools cache
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: ~/.toolcache/ohos-commandline-tools
          key: macos-clt-${{ env.CLT_VERSION }}
      - name: ohpm needs the command-line tools cache
        if: steps.clt-cache.outputs.cache-hit != 'true'
        run: |
          echo "error: command-line tools cache is cold; the harmony job must" >&2
          echo "run first in the same workflow (it downloads and caches them)." >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: harmony-har
          path: dist
      - name: configure credentials
        run: |
          mkdir -p ~/.ohpm
          printf '%s\n' "$OHPM_PRIVATE_KEY" > ~/.ohpm/ohpm_publish
          chmod 600 ~/.ohpm/ohpm_publish
          # The bundle tarball contains crypto/... — extract into ~/.ohpm so
          # it lands at ~/.ohpm/crypto, where crypto_path points.
          base64 -d <<< "$OHPM_CRYPTO_BUNDLE" | tar xz -C ~/.ohpm
          CLT="$HOME/.toolcache/ohos-commandline-tools/command-line-tools"
          OHPM="$CLT/bin/ohpm"
          "$OHPM" config set publish_id "$OHPM_PUBLISH_ID"
          "$OHPM" config set key_path ~/.ohpm/ohpm_publish
          "$OHPM" config set crypto_path ~/.ohpm/crypto
          "$OHPM" config set key_passphrase "$OHPM_KEY_PASSPHRASE_CIPHER"
        env:
          OHPM_PUBLISH_ID: ${{ secrets.OHPM_PUBLISH_ID }}
          OHPM_PRIVATE_KEY: ${{ secrets.OHPM_PRIVATE_KEY }}
          OHPM_KEY_PASSPHRASE_CIPHER: ${{ secrets.OHPM_KEY_PASSPHRASE_CIPHER }}
          OHPM_CRYPTO_BUNDLE: ${{ secrets.OHPM_CRYPTO_BUNDLE }}
      - name: publish (already-published versions are a success)
        run: |
          CLT="$HOME/.toolcache/ohos-commandline-tools/command-line-tools"
          OHPM="$CLT/bin/ohpm"
          if "$OHPM" info xpatchlib 2>/dev/null | grep -q "${GITHUB_REF_NAME#v}"; then
            echo "xpatchlib ${GITHUB_REF_NAME#v} already on ohpm; skipping"
            exit 0
          fi
          # The "contains source code" WARN is expected for HARs and does
          # not block; ohpm reviews submissions on their side.
          "$OHPM" publish dist/xpatchlib.har

  npm:
    name: npm publish
    needs: [wasm, release]
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - name: unpack the package dir
        run: mkdir pkg && unzip -q dist/xpatchlib-npm-*.zip -d pkg
      - name: skip when the version is already published
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@lynfe/xpatchlib@${VERSION}" version >/dev/null 2>&1; then
            echo "@lynfe/xpatchlib ${VERSION} already on npm; skipping"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: npm publish
        if: env.SKIP != '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [[ -n "$NODE_AUTH_TOKEN" ]] || {
            echo "error: NPM_TOKEN secret is not set" >&2
            exit 1
          }
          npm publish pkg --access public

  # Renders the podspec against the zip this pipeline just built and
  # published (version from the tag, sha256 from the artifact), then pushes
  # it to CocoaPods trunk. The token is the COCOAPODS_TRUNK_TOKEN repo
  # secret (from ~/.netrc after `pod trunk register`); trunk sessions
  # expire after ~4 months — re-register and update the secret then.
  cocoapods:
    name: cocoapods trunk push
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-xcframework
          path: dist
      - name: render the podspec for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 dist/XPatchlib.xcframework.zip | cut -d' ' -f1)"
          echo "publishing XPatchlib $VERSION (zip sha256 $SHA)"
          sed -e "s|s\.version *= *'[^']*'|s.version          = '$VERSION'|" \
              -e "s|releases/download/[^/]*/|releases/download/${GITHUB_REF_NAME}/|" \
              -e "s|:sha256 => '[^']*'|:sha256 => '$SHA'|" \
              packaging/ios/XPatchlib.podspec > "$RUNNER_TEMP/XPatchlib.podspec"
          echo "PUSHED_SHA=$SHA" >> "$GITHUB_ENV"
      - name: skip when the version is already on trunk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Anchored so v0.3.0 does not match a published 0.3.0-rc1.
          if pod trunk info XPatchlib 2>/dev/null | grep -Eq -- "- ${VERSION}( |$)"; then
            echo "XPatchlib $VERSION is already on trunk; skipping push"
            echo "SKIP=1" >> "$GITHUB_ENV"
            # Trunk keeps the FIRST pushed sha; this run's rebuilt zip must
            # not be mistaken for it in the verification step.
            echo "PUSHED_SHA=" >> "$GITHUB_ENV"
          fi
      - name: pod trunk push
        if: env.SKIP != '1'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          [[ -n "$COCOAPODS_TRUNK_TOKEN" ]] || {
            echo "error: COCOAPODS_TRUNK_TOKEN secret is not set" >&2
            exit 1
          }
          # trunk push flakily times out calling the GitHub commit API;
          # retry, but treat "already on trunk" as success (a prior attempt
          # may have landed server-side before the client timed out).
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3; do
            if pod trunk push "$RUNNER_TEMP/XPatchlib.podspec"; then exit 0; fi
            if pod trunk info XPatchlib 2>/dev/null | grep -Eq -- "- ${VERSION}( |$)"; then
              echo "XPatchlib $VERSION is on trunk despite the push error"
              exit 0
            fi
            echo "pod trunk push attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
      - name: record the pushed sha in the release body
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Trunk specs are immutable and the CDN only exposes them after a
          # propagation delay measured in hours, so the pipeline cannot read
          # the pushed spec back. Instead pin the pushed sha256 in a hidden
          # release-body marker; later runs (and humans) verify against it.
          RELEASE_JSON="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          if grep -q "xpatchlib-pod-sha256" <<<"$RELEASE_JSON"; then
            echo "marker already present; leaving the release body untouched"
            exit 0
          fi
          RELEASE_ID="$(jq -r .id <<<"$RELEASE_JSON")"
          BODY="$(jq -r .body <<<"$RELEASE_JSON")"
          MARKED_BODY="$(printf '%s\n<!-- xpatchlib-pod-sha256: %s -->\n' "$BODY" "$PUSHED_SHA")"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f body="$MARKED_BODY"
      - name: verify trunk spec matches the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The invariant this pipeline must keep: the sha256 declared by the
          # immutable trunk spec equals the bytes attached to the GitHub
          # release. A re-tag rebuilds the zip, so without the freeze step in
          # the release job this is exactly where a broken pod would ship.
          RELEASE_JSON="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          TRUNK_SHA="${PUSHED_SHA:-}"
          if [ -z "$TRUNK_SHA" ]; then
            # This run skipped the push; the marker from the run that did
            # push is the record of what trunk declares.
            TRUNK_SHA="$(sed -n 's/.*xpatchlib-pod-sha256: \([0-9a-f]\{64\}\).*/\1/p' \
              <<<"$RELEASE_JSON")"
          fi
          if [ -z "$TRUNK_SHA" ]; then
            # Releases cut before the marker existed. Not a failure — the
            # marker starts existing with the first release that uses it.
            echo "::warning::no pod sha marker for $VERSION; skipping consistency check"
            exit 0
          fi
          read -r ASSET_SHA ASSET_URL <<<"$(jq -r \
            '.assets[] | select(.name == "XPatchlib.xcframework.zip") | ((.digest // "") + " " + .browser_download_url)' \
            <<<"$RELEASE_JSON")"
          if [ -z "$ASSET_SHA" ]; then
            ASSET_SHA="$(curl -sL "$ASSET_URL" | shasum -a 256 | cut -d' ' -f1)"
          else
            ASSET_SHA="${ASSET_SHA#sha256:}"
          fi
          echo "trunk sha256 $TRUNK_SHA / release asset $ASSET_SHA"
          [ "$TRUNK_SHA" = "$ASSET_SHA" ] || {
            echo "::error::trunk spec sha does not match the release asset — every 'pod install' of $VERSION will fail"
            exit 1
          }
