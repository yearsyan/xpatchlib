# Tag-driven release: test, build every artifact on hosted runners, archive
# them on the GitHub Release, then push to the registries wired below
# (Maven Central via PUBLISH_MAVEN, CocoaPods trunk via its token; npm and
# ohpm publishing are still manual — see docs/INTEGRATION.md).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: '0.15.0'
  NDK_VERSION: '28.2.13676358'
  OHOS_SDK_VERSION: '5.0.3'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check -p xpatchlib-ffi -p xpatchlib-jni

  wasm:
    name: wasm package (producer side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: install wasm-pack
        run: |
          curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1
          install -m755 wasm-pack ~/.cargo/bin/wasm-pack
      - run: bash packaging/npm/build.sh
      - run: npm test
        working-directory: packaging/npm
      - name: pack the npm dir for the release assets
        run: |
          cd packaging/npm
          zip -qr "$RUNNER_TEMP/xpatchlib-npm-$(sed -n 's/^  "version": "\(.*\)",/\1/p' package.json).zip" \
            index.js index.d.ts package.json wasm README.md -x 'wasm/.gitignore'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/xpatchlib-npm-*.zip
          if-no-files-found: error

  android:
    name: android aar (replay only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: install ndk
        run: yes | sdkmanager "ndk;${NDK_VERSION}" >/dev/null
      # build-aar.sh discovers the NDK under $ANDROID_HOME/ndk/* by itself.
      - run: bash packaging/android/build-aar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: packaging/android/build/*.aar
          if-no-files-found: error

  ios:
    name: ios xcframework (replay only)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: bash packaging/ios/build-xcframework.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: packaging/ios/build/*.xcframework.zip
          if-no-files-found: error

  harmony:
    name: harmony har (replay only)
    runs-on: macos-14
    env:
      # Huawei ships the command-line tools only inside DevEco / behind a
      # developer login; Tencent/BqLog's CI popularized this public mirror
      # of the mac-arm64 commandline-tools zip, which bundles hvigor, ohpm
      # and the full HarmonyOS SDK (~1.8 GB, cached).
      CLT_VERSION: '6.0.0.858'
      CLT_MIRROR_REPO: pippocao/Images
      CLT_MIRROR_TAG: OHOS_Mac_Arm64_CommandLineTool_6.0.0
      CLT_MIRROR_ASSET: commandline-tools-mac-arm64-6.0.0.858.zip
    defaults:
      run:
        working-directory: packaging/harmony
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos
      - uses: Swatinem/rust-cache@v2
      - name: restore command-line tools cache
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: ~/.toolcache/ohos-commandline-tools
          key: macos-clt-${{ env.CLT_VERSION }}
      - name: download command-line tools (cache miss)
        if: steps.clt-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.toolcache/ohos-commandline-tools
          gh release download "$CLT_MIRROR_TAG" \
            --repo "$CLT_MIRROR_REPO" --pattern "$CLT_MIRROR_ASSET" \
            --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$CLT_MIRROR_ASSET" -d ~/.toolcache/ohos-commandline-tools
      - name: stage rust static lib + header
        run: bash build.sh
        env:
          OHOS_NDK_HOME: ~/.toolcache/ohos-commandline-tools/command-line-tools/sdk/default/openharmony/native
      - name: assemble har
        run: |
          CLT="$HOME/.toolcache/ohos-commandline-tools/command-line-tools"
          export PATH="$CLT/bin:$PATH"
          export DEVECO_SDK_HOME="$CLT/sdk"
          hvigorw assembleHar --mode module -p product=default --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-har
          path: packaging/harmony/xpatchlib/build/default/outputs/default/xpatchlib.har
          if-no-files-found: error

  maven-central:
    name: maven central upload
    needs: android
    # Flip the PUBLISH_MAVEN repo variable to "true" once the Central
    # Portal secrets are configured. Central releases are immutable — a
    # published version can never be re-uploaded.
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-aar
          path: dist
      - name: assemble + sign + upload
        run: bash packaging/android/publish-maven.sh dist/xpatchlib-*.aar --upload
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  release:
    name: github release
    needs: [test, wasm, android, ios, harmony]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: sanity check artifacts
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  # Renders the podspec against the zip this pipeline just built and
  # published (version from the tag, sha256 from the artifact), then pushes
  # it to CocoaPods trunk. The token is the COCOAPODS_TRUNK_TOKEN repo
  # secret (from ~/.netrc after `pod trunk register`); trunk sessions
  # expire after ~4 months — re-register and update the secret then.
  cocoapods:
    name: cocoapods trunk push
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-xcframework
          path: dist
      - name: render the podspec for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 dist/XPatchlib.xcframework.zip | cut -d' ' -f1)"
          echo "publishing XPatchlib $VERSION (zip sha256 $SHA)"
          sed -e "s|s\.version *= *'[^']*'|s.version          = '$VERSION'|" \
              -e "s|releases/download/[^/]*/|releases/download/${GITHUB_REF_NAME}/|" \
              -e "s|:sha256 => '[^']*'|:sha256 => '$SHA'|" \
              packaging/ios/XPatchlib.podspec > "$RUNNER_TEMP/XPatchlib.podspec"
      - name: skip when the version is already on trunk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Anchored so v0.3.0 does not match a published 0.3.0-rc1.
          if pod trunk info XPatchlib 2>/dev/null | grep -Eq -- "- ${VERSION}( |$)"; then
            echo "XPatchlib $VERSION is already on trunk; skipping push"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: pod trunk push
        if: env.SKIP != '1'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          [[ -n "$COCOAPODS_TRUNK_TOKEN" ]] || {
            echo "error: COCOAPODS_TRUNK_TOKEN secret is not set" >&2
            exit 1
          }
          # trunk push flakily times out calling the GitHub commit API;
          # retry, but treat "already on trunk" as success (a prior attempt
          # may have landed server-side before the client timed out).
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3; do
            if pod trunk push "$RUNNER_TEMP/XPatchlib.podspec"; then exit 0; fi
            if pod trunk info XPatchlib 2>/dev/null | grep -Eq -- "- ${VERSION}( |$)"; then
              echo "XPatchlib $VERSION is on trunk despite the push error"
              exit 0
            fi
            echo "pod trunk push attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
