[workspace]
resolver = "2"
members = [
    "crates/xpatchlib-core",
    "crates/xpatchlib-ffi",
    "crates/xpatchlib-jni",
    "crates/xpatchlib-wasm",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/yearsyan/xpatchlib"

[workspace.dependencies]
# Replay-only by default: the mobile crates inherit this entry verbatim.
# The producer (xpatchlib-wasm) re-enables the feature in its own manifest.
xpatchlib-core = { path = "crates/xpatchlib-core", version = "0.1.0", default-features = false }
sha2 = "0.10"
thiserror = "2"
zstd = "0.13"
jni = "0.21"
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
strip = true
