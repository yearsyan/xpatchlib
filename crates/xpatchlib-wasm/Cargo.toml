[package]
name = "xpatchlib-wasm"
description = "WASM bindings for xpatchlib: patch generation in the Node build toolchain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Producer side of the toolchain: patch generation included.
xpatchlib-core = { workspace = true, features = ["produce"] }
wasm-bindgen.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
