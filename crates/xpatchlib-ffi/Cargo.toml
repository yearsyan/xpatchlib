[package]
name = "xpatchlib-ffi"
description = "C ABI for xpatchlib: one shared library serving iOS and HarmonyOS replay"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Replay only: inherits the workspace entry (default-features = false), so
# patch production code is not compiled into iOS / HarmonyOS artifacts.
xpatchlib-core.workspace = true
